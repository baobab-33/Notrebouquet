.gl{width:100%;aspect-ratio:5/6}.row img{flex:none;width:64px;height:64px}.hero img{width:150px;height:150px;margin:0 auto 6px;display:block}
.rain{position:absolute;inset:0;pointer-events:none}

.status{text-align:center;margin:4px 0 12px}
.list{display:grid;gap:10px;margin-top:12px}

.row svg{flex:none;width:64px;height:64px}

.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:10px;margin:14px auto 0;display:block}
