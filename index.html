function tod(d=new Date()){const h=d.getHours()+d.getMinutes()/60;let i=TOD.length-2;while(i>0&&TOD[i].h>h)i--;

const sfx={c:null,g:null,
init(){try{if(this.c)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.c=new C(),n=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

function wireCan(stage,done){const can=$("#can");if(!can)return;let on=false,ox=0,oy=0,pour=0,last=0,dropT=0,vt=0;const pb=$("#pbar");
const inZone=()=>{const s=stage.getBoundingClientRect(),c=can.getBoundingClientRect(),x=(c.left+c.width*.2-s.left)/s.width,y=(c.top+c.height*.5-s.top)/s.height;return x>.15&&x<.85&&y>.05&&y<.75};
const spawn=()=>{const s=stage.getBoundingClientRect(),c=can.getBoundingClientRect(),i=document.createElement("i"),r=$("#rain");if(!r)return;i.style.left=(c.left-s.left+2)+"px";i.style.top=(c.top-s.top+c.height*.35)+"px";i.style.animationDuration=".8s";r.appendChild(i);setTimeout(()=>i.remove(),900)};
const tick=now=>{if(!on)return;requestAnimationFrame(tick);const dt=Math.min(60,now-last);last=now;const z=inZone();can.classList.toggle("pour",z);sfx.pour(z);
if(z){pour+=dt;dropT+=dt;vt+=dt;if(dropT>70){dropT=0;spawn()}if(vt>140){vt=0;if(navigator.vibrate)navigator.vibrate(18)}
pb.classList.add("on");pb.firstChild.style.width=Math.min(100,pour/2400*100)+"%";if(pour>=2400){on=false;sfx.pour(false);done()}}};
can.onpointerdown=e=>{e.preventDefault();sfx.init();on=true;can.setPointerCapture(e.pointerId);can.classList.add("drag");const s=stage.getBoundingClientRect(),c=can.getBoundingClientRect();ox=e.clientX-c.left;oy=e.clientY-c.top;
can.style.right="auto";can.style.bottom="auto";can.style.left=(c.left-s.left)+"px";can.style.top=(c.top-s.top)+"px";last=performance.now();requestAnimationFrame(tick)};
can.onpointermove=e=>{if(!on)return;const s=stage.getBoundingClientRect();can.style.left=Math.max(0,Math.min(s.width-can.offsetWidth,e.clientX-s.left-ox))+"px";can.style.top=Math.max(0,Math.min(s.height-can.offsetHeight,e.clientY-s.top-oy))+"px"};
can.onpointerup=can.onpointercancel=()=>{on=false;can.classList.remove("drag","pour");sfx.pour(false)};

function makeButterfly(){const g=new THREE.Group(),sh=new THREE.Shape();sh.moveTo(0,0);sh.bezierCurveTo(.3,.7,1.2,1,1.1,.35);sh.bezierCurveTo(1.05,-.1,.6,-.55,0,0);
